name: Aman Player v0.3.0 APK Build

on:
  push:
    branches:
      - aman-player-build-v030

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Reconstruct and prepare Aman Player v0.3.0
        shell: bash
        run: |
          set -euxo pipefail
          cat aman_v030_chunks/chunk_*.txt | tr -d '\n\r' | base64 --decode > /tmp/aman_player_v030.tar.xz
          echo "5e0b801aabc0d661c0940c3bedcf9de396baee39407e19516811905b8b4aea18  /tmp/aman_player_v030.tar.xz" | sha256sum -c -
          rm -rf /tmp/aman_src /tmp/aman
          mkdir -p /tmp/aman_src
          tar -xJf /tmp/aman_player_v030.tar.xz -C /tmp/aman_src
          flutter create --platforms=android --org com.mahmoud --project-name amanplayer /tmp/aman
          rm -rf /tmp/aman/lib /tmp/aman/test
          cp -a /tmp/aman_src/lib /tmp/aman/lib
          cp /tmp/aman_src/pubspec.yaml /tmp/aman/pubspec.yaml
          cp /tmp/aman_src/android/app/src/main/AndroidManifest.xml /tmp/aman/android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/aman/lib/pages/player_page.dart')
          s = p.read_text()
          s = s.replace("final result = await FilePicker.platform.pickFiles(\n      allowMultiple: false,", "final result = await FilePicker.pickFile(")
          s = s.replace("final path = result?.files.single.path;", "final path = result?.path;")
          s = s.replace("final name = result!.files.single.name;", "final name = result!.name;")
          p.write_text(s)
          PY
          mkdir -p /tmp/aman/assets/branding
          if [ -d /tmp/aman_src/assets ]; then cp -a /tmp/aman_src/assets/. /tmp/aman/assets/; fi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "/tmp/aman/android/app/src/main/res/mipmap-$d"
            cp aman_player_app/ic_launcher.png "/tmp/aman/android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          grep -q 'applicationId = "com.mahmoud.amanplayer"' /tmp/aman/android/app/build.gradle.kts
          sed -i '/signingConfig = signingConfigs.getByName("debug")/d' /tmp/aman/android/app/build.gradle.kts
          grep -q '^version: 0.3.0+3' /tmp/aman/pubspec.yaml
          grep -R -F -q 'تصميم وبرمجة : م.محمود دغَبس  مبايل:774813824' /tmp/aman/lib

      - name: Resolve packages
        working-directory: /tmp/aman
        run: |
          set -euxo pipefail
          flutter --version
          flutter pub get

      - name: Analyze
        working-directory: /tmp/aman
        run: |
          set -euxo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build unsigned ARM64 release
        working-directory: /tmp/aman
        shell: bash
        run: |
          set -euxo pipefail
          flutter build apk --release --target-platform android-arm64
          APK="$(find build -type f -name 'app-release.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          test -x "$AAPT"
          "$ZIPALIGN" -f -p 4 "$APK" "$GITHUB_WORKSPACE/AmanPlayer-v0.3.0-arm64-aligned-unsigned.apk"
          "$AAPT" dump badging "$GITHUB_WORKSPACE/AmanPlayer-v0.3.0-arm64-aligned-unsigned.apk" | tee "$GITHUB_WORKSPACE/badging-v030.txt"
          grep -q "package: name='com.mahmoud.amanplayer'" "$GITHUB_WORKSPACE/badging-v030.txt"
          grep -q "versionCode='3'" "$GITHUB_WORKSPACE/badging-v030.txt"
          grep -q "versionName='0.3.0'" "$GITHUB_WORKSPACE/badging-v030.txt"
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          test -f "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" "$GITHUB_WORKSPACE/apksigner.jar"
          sha256sum "$GITHUB_WORKSPACE/AmanPlayer-v0.3.0-arm64-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/unsigned-v030.sha256"
          ls -lh "$GITHUB_WORKSPACE/AmanPlayer-v0.3.0-arm64-aligned-unsigned.apk"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: AmanPlayer-v0.3.0-unsigned
          path: |
            AmanPlayer-v0.3.0-arm64-aligned-unsigned.apk
            apksigner.jar
            badging-v030.txt
            unsigned-v030.sha256
          if-no-files-found: error
          compression-level: 0
