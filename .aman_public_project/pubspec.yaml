name: aman_player
description: Local-first secure Flutter video player inspired by MX Player, VLC, XPlayer and NOVA.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  photo_manager: ^3.12.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
